name: Release

# A release is a tag: pushing vX.Y.Z tests the tree, builds both macOS
# architectures, and creates or fills the draft release of that version.
# The draft is published only after every asset is uploaded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, its assets and the uploads

jobs:
  release:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag against mygo.json
        run: |
          version="$(jq -r .version mygo.json)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::the tag $GITHUB_REF_NAME does not match mygo.json's v$version"
            exit 1
          }
      - name: Test
        run: go test ./...
      - name: Build
        run: go tool mygo build -platform darwin/arm64,darwin/amd64
      - name: Check the artifacts
        run: |
          version="$(jq -r .version mygo.json)"
          test -f "build/darwin-arm64/mojian-$version-arm64.dmg"
          test -f "build/darwin-amd64/mojian-$version-amd64.dmg"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is published already: bump the version in mygo.json"
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi
      - name: Upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version mygo.json)"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "build/darwin-arm64/mojian-$version-arm64.dmg" \
            "build/darwin-amd64/mojian-$version-amd64.dmg"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
