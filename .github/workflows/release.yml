name: Release

# A release is a tag: pushing vX.Y.Z tests the tree, builds macOS for
# Apple Silicon and Intel and Linux for amd64 and arm64, then creates or
# fills the draft release of that version. The draft is published only
# after every asset is uploaded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, its assets and the uploads

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag against mygo.json
        run: |
          version="$(jq -r .version mygo.json)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::the tag $GITHUB_REF_NAME does not match mygo.json's v$version"
            exit 1
          }
      - name: Test
        run: go test ./...
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64
      - name: Check the artifacts
        run: |
          version="$(jq -r .version mygo.json)"
          test -f "build/darwin-arm64/mojian-$version-arm64.dmg"
          test -f "build/darwin-amd64/mojian-$version-amd64.dmg"
          test -f "build/darwin-arm64/mojian-$version-darwin-arm64.tar.gz"
          test -f "build/darwin-amd64/mojian-$version-darwin-amd64.tar.gz"
          test -f "build/darwin-arm64/update-darwin-arm64.json"
          test -f "build/darwin-amd64/update-darwin-amd64.json"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-amd64/*.dmg
            build/darwin-*/*-darwin-*.tar.gz
            build/darwin-*/update-*.json
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag against mygo.json
        run: |
          version="$(jq -r .version mygo.json)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::the tag $GITHUB_REF_NAME does not match mygo.json's v$version"
            exit 1
          }
      - name: Test
        run: go test ./...
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform linux/amd64,linux/arm64
      - name: Check the artifacts
        run: |
          version="$(jq -r .version mygo.json)"
          test -f "build/linux-amd64/mojian-$version-linux-amd64.tar.gz"
          test -f "build/linux-amd64/mojian_${version}_amd64.deb"
          test -f "build/linux-arm64/mojian-$version-linux-arm64.tar.gz"
          test -f "build/linux-arm64/mojian_${version}_arm64.deb"
          test -f "build/linux-amd64/update-linux-amd64.json"
          test -f "build/linux-arm64/update-linux-arm64.json"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/linux-amd64/*.tar.gz
            build/linux-amd64/*.deb
            build/linux-amd64/install.sh
            build/linux-amd64/update-*.json
            build/linux-arm64/*.tar.gz
            build/linux-arm64/*.deb
            build/linux-arm64/update-*.json
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Flatten the artifacts
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -exec rm -rf {} +
      - name: Check the assets
        run: |
          version="$(jq -r .version mygo.json)"
          test -f "dist/mojian-$version-arm64.dmg"
          test -f "dist/mojian-$version-amd64.dmg"
          test -f "dist/mojian-$version-darwin-amd64.tar.gz"
          test -f "dist/mojian-$version-darwin-arm64.tar.gz"
          test -f "dist/update-darwin-amd64.json"
          test -f "dist/update-darwin-arm64.json"
          test -f "dist/mojian-$version-linux-amd64.tar.gz"
          test -f "dist/mojian-$version-linux-arm64.tar.gz"
          test -f "dist/mojian_${version}_amd64.deb"
          test -f "dist/mojian_${version}_arm64.deb"
          test -f "dist/update-linux-amd64.json"
          test -f "dist/update-linux-arm64.json"
          test -f "dist/install.sh"
          ls -lh dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is published already: bump the version in mygo.json"
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi
      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.dmg *.tar.gz *.deb *.json install.sh > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.dmg dist/*.tar.gz dist/*.deb dist/*.json dist/install.sh dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
